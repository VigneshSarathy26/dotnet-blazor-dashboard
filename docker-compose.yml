services:
  dotNetBlazorDashboard.web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DatabaseProvider=PostgreSQL # Switch to 'SqlServer' for MS-SQL
      - ConnectionStrings__DefaultConnection=Host=pgdb;Database=dashboard;Username=postgres;Password=password
    depends_on:
      - pgdb
      - redis

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassword!123
    ports:
      - "1433:1433"

  pgdb:
    image: postgres:latest
    environment:
      - POSTGRES_DB=dashboard
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  nginx:
    image: nginx:latest
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - dotNetBlazorDashboard.web
