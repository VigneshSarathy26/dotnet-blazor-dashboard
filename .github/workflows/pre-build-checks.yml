name: pre build checks

on: 
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint:
    name: Linting
    runs-on: windows-latest
    permissions:
      contents: read # for checkout to fetch code
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: lint 
        run: dotnet format --verify-no-changes --severity warn