name: Building docker image 

on:
  push:
    branches:
      - main
      - dev

jobs:
  Build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout to fetch code
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

  deploy:
    needs: Build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout to fetch code
    steps:
      - name: Checkout code
        uses: actions/checkout@v7



